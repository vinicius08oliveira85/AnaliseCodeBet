<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070a12">
<title>Análise de Apostas — modelo de futebol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-txt">
        <h1>Análise de Apostas</h1>
        <div class="sub" id="sub">carregando dados…</div>
      </div>
    </div>
  </div>
</div>

<nav class="menu-bar" aria-label="Funcionalidades">
  <div class="menu">
    <button class="menu-item act" data-sec="sec-taxas" onclick="irPara('sec-taxas')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Taxas de acerto
    </button>
    <button class="menu-item" data-sec="sec-combo" onclick="irPara('sec-combo')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/></svg>
      Combinação
      <span class="cnt" id="menu-combo"></span>
    </button>
    <button class="menu-item" data-sec="sec-auto" onclick="irPara('sec-auto')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.8L18.5 9.7l-4.6 1.9L12 16.4l-1.9-4.8-4.6-1.9 4.6-1.9L12 3z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg>
      Sugestões
    </button>
    <button class="menu-item" data-sec="sec-jogos" onclick="irPara('sec-jogos')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
      Jogos e previsões
    </button>
    <span class="menu-sep" aria-hidden="true"></span>
    <button class="menu-item" data-sec="sec-apostas" onclick="irPara('sec-apostas')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
      Apostas
      <span class="cnt" id="menu-apostas"></span>
    </button>
    <button class="menu-item" data-sec="sec-vivo" onclick="irPara('sec-vivo')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="12" height="12" rx="3"/><path d="M18 10h2.5a1.5 1.5 0 0 1 0 3H18"/><path d="M20 14v.01"/></svg>
      Ao vivo
      <span class="cnt" id="menu-vivo"></span>
    </button>
  </div>
</nav>

<main class="wrap">
  <section id="sec-prev">
    <section class="sec" id="sec-taxas">
      <h2>Taxas de acerto <span class="n" id="meta1"></span></h2>
      <div class="filtro" id="filtro-stat"></div>
      <div class="stats" id="stats">
        <div class="skeleton" style="height:74px"></div>
        <div class="skeleton" style="height:74px"></div>
        <div class="skeleton" style="height:74px"></div>
        <div class="skeleton" style="height:74px"></div>
        <div class="skeleton" style="height:74px"></div>
        <div class="skeleton" style="height:74px"></div>
      </div>
    </section>

    <div class="grid2">
      <section class="sec" id="sec-combo">
        <h2>Sua combinação <span class="n" id="combo-n"></span></h2>
        <div class="card" id="combo"></div>
      </section>
      <section class="sec" id="sec-auto">
        <h2>Sugestões automáticas</h2>
        <div class="card" id="auto"></div>
      </section>
    </div>

    <section class="sec" id="sec-jogos">
      <h2>Jogos e previsões <span class="n" id="meta2"></span></h2>
      <div class="filtro" id="filtro"></div>
      <div class="jogos" id="jogos">
        <div class="skeleton" style="height:220px"></div>
        <div class="skeleton" style="height:220px"></div>
        <div class="skeleton" style="height:220px"></div>
        <div class="skeleton" style="height:220px"></div>
      </div>
    </section>
  </section>

  <section class="sec" id="sec-vivo" hidden>
    <h2>Validação ao vivo <span class="n" id="vivo-meta"></span></h2>
    <div class="stats" id="vivo-stats"></div>
    <div id="vivo"></div>
  </section>

  <section class="sec" id="sec-apostas" hidden>
    <h2>Apostas <span class="n" id="apostas-n"></span></h2>
    <div id="apostas"></div>
  </section>
</main>

<div class="foot">
  Previsões do modelo (Poisson + Dixon-Coles, SOT, escanteios) · Validação walk-forward fora de amostra
</div>
<script src="app.js"></script>
</body>
</html>
